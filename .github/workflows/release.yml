name: Release

# Builds the release artifacts for a tag and attaches them to the GitHub
# release for that tag.
#
# Normally invoked by release-please.yml right after a release is tagged (see
# docs/releasing.md). It can also be dispatched by hand for a tag that has no
# artifacts yet:
#
#   gh workflow run release.yml -f tag_name=v0.13.0
#
# There is deliberately no `push: tags` trigger: Release Please already creates
# the release, and a tag-triggered run would duplicate every build.

on:
  workflow_call:
    inputs:
      tag_name:
        description: Tag being released (e.g. v0.13.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag to build and publish (e.g. v0.13.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-latest
            goarch: arm64
            asset: toast-darwin-arm64
          - runner: macos-14
            goarch: amd64
            asset: toast-darwin-amd64
          - runner: ubuntu-latest
            goarch: amd64
            asset: toast-linux-amd64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ inputs.tag_name }}" -o ${{ matrix.asset }} ./cmd/toast

      - name: Archive (zip)
        run: zip ${{ matrix.asset }}.zip ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

  # Standalone macOS app: toast bundled with a libghostty terminal window,
  # wrapped in dist/Toast.app and shipped as a zip. Arm64 only: GitHub no
  # longer offers Intel macOS runners.
  # See scripts/build-libghostty-bundle.sh and docs/experimental/libghostty-bundle.md.
  build-app:
    name: Build toast-app-darwin-arm64
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build standalone app bundle
        env:
          TOAST_VERSION: ${{ inputs.tag_name }}
        run: scripts/build-libghostty-bundle.sh

      - name: Archive (zip)
        run: |
          cd dist
          zip -r ../toast-app-darwin-arm64.zip Toast.app

      - uses: actions/upload-artifact@v4
        with:
          name: toast-app-darwin-arm64
          path: toast-app-darwin-arm64.zip

  release:
    name: Attach release artifacts
    needs: [build, build-app]
    runs-on: ubuntu-latest
    outputs:
      darwin_arm64_sha: ${{ steps.sha.outputs.darwin_arm64 }}
      darwin_amd64_sha: ${{ steps.sha.outputs.darwin_amd64 }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # Only needed when this workflow creates the release itself (a hand-
      # dispatched tag): the notes are taken from RELEASE_NOTES.md so the manual
      # path publishes the same body as a Release Please run.
      - name: Check out the tag for release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          path: source

      - name: Compute SHA256 sums
        id: sha
        run: |
          echo "darwin_arm64=$(sha256sum toast-darwin-arm64.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "darwin_amd64=$(sha256sum toast-darwin-amd64.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      # Release Please already created the release, so only upload assets and
      # leave its notes alone. A hand-dispatched tag has no release yet, so
      # create one using the tag's RELEASE_NOTES.md section; GitHub's generated
      # notes are a fallback for a tag with no section.
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./*.zip --clobber
            exit 0
          fi
          if notes="$(source/scripts/release-notes-section.sh "$TAG" source/RELEASE_NOTES.md)"; then
            printf '%s\n' "$notes" > release-notes.md
            gh release create "$TAG" ./*.zip --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" ./*.zip --title "$TAG" --generate-notes
          fi

      # Release Please builds the release body from the release PR body, while
      # RELEASE_NOTES.md is a separate copy of the same notes. Editing only one
      # of them ships a release whose body and changelog disagree, so surface it
      # as a warning instead of leaving it unnoticed.
      - name: Check the release body matches RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag_name }}
        run: |
          expected="$(source/scripts/release-notes-section.sh "$TAG" source/RELEASE_NOTES.md || true)"
          if [ -z "$expected" ]; then
            echo "no RELEASE_NOTES.md section for $TAG; skipping the comparison"
            exit 0
          fi
          normalize() {
            awk 'NF { for (i = 0; i < blank; i++) print ""; print; blank = 0; next }
                 { blank++ }' | sed -e 's/[[:space:]]*$//'
          }
          actual="$(gh release view "$TAG" --json body --jq .body)"
          if [ "$(printf '%s\n' "$expected" | normalize)" != "$(printf '%s\n' "$actual" | normalize)" ]; then
            echo "::warning title=Release notes differ::$TAG: the GitHub release body does not match the RELEASE_NOTES.md section (see docs/releasing.md, 'Where the notes live')."
          fi

  homebrew:
    name: Update homebrew tap
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: paradise-runner/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Render formula
        env:
          VERSION: ${{ inputs.tag_name }}
          ARM64_SHA: ${{ needs.release.outputs.darwin_arm64_sha }}
          AMD64_SHA: ${{ needs.release.outputs.darwin_amd64_sha }}
        run: |
          cat > homebrew-tap/toast.rb <<EOF
          # typed: false
          # frozen_string_literal: true

          # DO NOT EDIT. Generated by release workflow.
          class Toast < Formula
            desc "In-terminal IDE for quick file edits"
            homepage "https://github.com/paradise-runner/toast"
            version "${VERSION#v}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/paradise-runner/toast/releases/download/${VERSION}/toast-darwin-arm64.zip"
                sha256 "${ARM64_SHA}"

                def install
                  bin.install "toast-darwin-arm64" => "toast"
                end
              else
                url "https://github.com/paradise-runner/toast/releases/download/${VERSION}/toast-darwin-amd64.zip"
                sha256 "${AMD64_SHA}"

                def install
                  bin.install "toast-darwin-amd64" => "toast"
                end
              end
            end

          end
          EOF

      - name: Commit and push
        working-directory: homebrew-tap
        env:
          VERSION: ${{ inputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add toast.rb
          git diff --cached --quiet || git commit -m "toast ${VERSION}"
          git push
