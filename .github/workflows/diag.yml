name: Diag

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [macos-latest, macos-14]
    steps:
      - name: Enumerate Xcodes and SDKs
        run: |
          echo "== default =="; xcode-select -p
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          for x in /Applications/Xcode*.app; do
            [ -d "$x" ] || continue
            echo "== $x =="
            "$x/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -2
            ls "$x/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs" 2>/dev/null
          done
          echo "== CLT SDK =="
          ls /Library/Developer/CommandLineTools/SDKs 2>/dev/null
